name: Android validation
on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check source artifacts
        run: python3 tools/check_repository.py
      - name: Clean build, tests, lint, debug, minified compile-check APK and AAB
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug assembleReleaseCheck bundleReleaseCheck --no-daemon
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
      - run: ruby tools/check_release_contract.rb
      - run: bundle exec fastlane lanes
