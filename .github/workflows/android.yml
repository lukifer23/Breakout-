name: Android validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check source artifacts
        run: |
          python3 tools/check_repository.py
          python3 tools/check_docs.py
          python3 tools/check_store_assets.py --allow-missing
      - name: Clean build, tests, lint, debug, minified compile-check APK and AAB
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug assembleReleaseCheck bundleReleaseCheck --no-daemon
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
      - run: ruby tools/check_release_contract.rb
      - run: bundle exec fastlane lanes
