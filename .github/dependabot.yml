version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    # Keep main as the sole persistent branch; security alerts remain enabled.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    # Keep main as the sole persistent branch; security alerts remain enabled.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    # Keep main as the sole persistent branch; security alerts remain enabled.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
